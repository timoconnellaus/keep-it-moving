<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#0e0f11;background:#fff}
.w{padding:clamp(20px,5vw,44px) clamp(20px,6vw,64px);display:grid;gap:24px;max-width:1100px}
h1{margin:0;font-size:30px;line-height:1.2}.sub{margin:-14px 0 0;color:#676c74}
.g{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(250px,1fr);gap:28px;align-items:start}
@media (max-width:640px){.g{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid #e4e6ea;border-radius:14px;padding:20px;display:grid;gap:12px}
.card b.h{font-size:13px;color:#676c74;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.it{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center}.it span{width:36px;height:36px;border-radius:9px;background:#ffd23f}
.it.p span{background:#f2357b}.it em{font-style:normal;font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid #e4e6ea;width:100%;margin:0}.t{display:flex;justify-content:space-between;font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;border:1px solid #e4e6ea;background:#fff;color:#0e0f11}
.btn.pri{background:#1f6bff;border-color:#1f6bff;color:#fff}
.steps{display:grid;gap:0}.s{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.s i{width:14px;height:14px;border-radius:50%;border:2px solid #cfd3da;background:#fff;margin-top:4px}
.s.done i{background:#2fbf71;border-color:#2fbf71}.s.now i{border-color:#1f6bff;box-shadow:0 0 0 4px #e8f0ff}
.s small{display:block;color:#676c74;font-size:13px}
.s:not(:last-child)::before{content:"";position:absolute;left:6px;top:22px;bottom:2px;width:2px;background:#e4e6ea}
.ok{display:inline-flex;width:44px;height:44px;border-radius:50%;background:#dff6e9;color:#146c3f;align-items:center;justify-content:center;font-size:22px;font-weight:700}
</style></head><body><div class="w"><div class="ok">✓</div><h1 data-name="thanks heading">Thanks, Sam. Your order's in.</h1><p class="sub">A receipt is on its way to sam@client.co.</p><div class="g"><div class="card" data-name="order summary"><b class="h">Order #1042</b><div class="it"><span></span><b>Field notebook</b><em>$32.00</em></div><div class="it p"><span></span><b>Pen, fine</b><em>$16.00</em></div><hr><div class="t"><span>Paid with •••• 4242</span><span>$48.00</span></div></div><div class="card" data-name="next steps"><b class="h">What's next</b><p style="margin:0;color:#676c74">We'll email you when it ships. Arrives Thu 12 Nov.</p><div class="btns"><span class="btn" data-name="track order button">Track order</span><span class="btn" data-name="keep shopping button">Keep shopping</span></div></div></div></div></body></html>
